services:
  - type: web
    name: paperclip-zhc
    repo: https://github.com/agentjuno/paperclip
    runtime: docker
    plan: starter
    region: oregon
    branch: zhc-main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3100"
      - key: SERVE_UI
        value: "true"
      - key: NODE_ENV
        value: "production"

      # Deployment mode
      - key: PAPERCLIP_DEPLOYMENT_MODE
        value: "authenticated"
      - key: PAPERCLIP_DEPLOYMENT_EXPOSURE
        value: "public"

      # Auth
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: PAPERCLIP_PUBLIC_URL
        value: "https://paperclip-zhc.onrender.com"
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        value: "https://paperclip-zhc.onrender.com,https://zhcinstitute.com"

      # ZHC wallet auth bridge
      - key: ZHC_GATING_SESSION_SECRET
        sync: false

      # Database (from Render Postgres)
      - key: DATABASE_URL
        fromDatabase:
          name: paperclip-db
          property: connectionString

      # Paperclip home directory (use Render disk)
      - key: PAPERCLIP_HOME
        value: "/paperclip"
      - key: PAPERCLIP_INSTANCE_ID
        value: "default"
      - key: PAPERCLIP_CONFIG
        value: "/paperclip/instances/default/config.json"

    disk:
      name: paperclip-data
      mountPath: /paperclip
      sizeGB: 1

databases:
  - name: paperclip-db
    databaseName: paperclip
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
