services:
  - type: web
    name: junoclip-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3100"
      - key: SERVE_UI
        value: "true"
      - key: PAPERCLIP_DEPLOYMENT_MODE
        value: authenticated
      - key: PAPERCLIP_DEPLOYMENT_EXPOSURE
        value: public
      - key: PAPERCLIP_PUBLIC_URL
        value: https://app.zhcinstitute.com
      - key: PAPERCLIP_AUTH_PUBLIC_BASE_URL
        value: https://app.zhcinstitute.com
      - key: COMPANY_SESSION_COOKIE_DOMAIN
        value: .zhcinstitute.com
      - key: VITE_ZHC_SITE_URL
        value: https://zhcinstitute.com
      - key: PAPERCLIP_STORAGE_PROVIDER
        value: s3
      - key: PAPERCLIP_STORAGE_S3_BUCKET
        sync: false
      - key: PAPERCLIP_STORAGE_S3_REGION
        sync: false
      - key: PAPERCLIP_STORAGE_S3_ENDPOINT
        sync: false
      - key: PAPERCLIP_STORAGE_S3_PREFIX
        value: junoclip
      - key: PAPERCLIP_STORAGE_S3_FORCE_PATH_STYLE
        value: "false"
      - key: COMPANY_SESSION_SECRET
        generateValue: true
      - key: PAPERCLIP_SECRETS_MASTER_KEY
        generateValue: true
      - key: PAPERCLIP_SECRETS_PROVIDER
        value: local_encrypted
      - key: PAPERCLIP_SECRETS_STRICT_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: junoclip-postgres
          property: connectionString

databases:
  - name: junoclip-postgres
    databaseName: junoclip
    user: junoclip
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
